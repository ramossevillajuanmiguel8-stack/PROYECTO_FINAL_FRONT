<div class="login-bg d-flex align-items-center justify-content-center min-vh-100 py-4">
  <div class="login-overlay"></div>

  <div class="container position-relative" style="z-index:2; max-width:480px">

    <div class="text-center mb-4">
      <div class="login-badge mb-3">
        <i class="bi bi-person-plus fs-1 text-warning"></i>
      </div>
      <h1 class="fw-bold text-white mb-1" style="font-size:1.8rem">Zona Mundial</h1>
      <p class="text-white-50 mb-0">Crear cuenta de usuario</p>
    </div>

    <div class="card border-0 shadow-lg" style="border-radius:16px;overflow:hidden">
      <div class="card-header border-0 text-center py-3"
           style="background:linear-gradient(135deg,#0A2342,#1D9E75)">
        <h5 class="text-white mb-0 fw-semibold">Registro</h5>
      </div>

      <div class="card-body p-4">

        @if (error) {
          <div class="alert alert-danger d-flex align-items-center gap-2 py-2">
            <i class="bi bi-exclamation-circle-fill"></i>
            <span>{{ error }}</span>
          </div>
        }

        @if (exito) {
          <div class="alert alert-success d-flex align-items-center gap-2 py-2">
            <i class="bi bi-check-circle-fill"></i>
            <span>{{ exito }}</span>
          </div>
        }

        <form (ngSubmit)="registrar()">

          <div class="mb-3">
            <label class="form-label fw-semibold text-secondary small">
              <i class="bi bi-person-badge me-1"></i>Nombre y apellido
            </label>
            <input type="text" class="form-control" placeholder="Ej: Juan Pérez"
                   [(ngModel)]="usuario.nombreapellido" name="nombreapellido" required
                   style="border-radius:10px">
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold text-secondary small">
              <i class="bi bi-envelope me-1"></i>Correo electrónico
            </label>
            <input type="email" class="form-control" placeholder="correo@ejemplo.com"
                   [(ngModel)]="usuario.email" name="email" required
                   style="border-radius:10px">
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold text-secondary small">
              <i class="bi bi-person me-1"></i>Username
            </label>
            <input type="text" class="form-control" placeholder="Ej: juanperez"
                   [(ngModel)]="usuario.username" name="username" required
                   style="border-radius:10px">
          </div>

          <div class="row g-2 mb-3">
            <div class="col-6">
              <label class="form-label fw-semibold text-secondary small">
                <i class="bi bi-lock me-1"></i>Contraseña
              </label>
              <div class="input-group">
                <input [type]="mostrarPassword ? 'text' : 'password'"
                       class="form-control" placeholder="6-8 caracteres"
                       [(ngModel)]="usuario.password" name="password" required
                       style="border-radius:10px 0 0 10px">
                <button type="button" class="btn btn-outline-secondary"
                        style="border-radius:0 10px 10px 0"
                        (click)="mostrarPassword = !mostrarPassword">
                  <i class="bi" [class.bi-eye]="!mostrarPassword"
                               [class.bi-eye-slash]="mostrarPassword"></i>
                </button>
              </div>
            </div>
            <div class="col-6">
              <label class="form-label fw-semibold text-secondary small">
                <i class="bi bi-lock-fill me-1"></i>Confirmar
              </label>
              <input [type]="mostrarPassword ? 'text' : 'password'"
                     class="form-control" placeholder="Repite la contraseña"
                     [(ngModel)]="confirmarPassword" name="confirmar" required
                     style="border-radius:10px">
            </div>
          </div>

          <div class="alert alert-info py-2 small mb-3">
            <i class="bi bi-info-circle me-1"></i>
            La contraseña debe tener entre 6 y 8 caracteres, al menos una mayúscula,
            una minúscula y un número.
          </div>

          <button type="submit" class="btn btn-lg w-100 text-white fw-semibold"
                  [disabled]="cargando"
                  style="background:linear-gradient(135deg,#0A2342,#1D9E75);border-radius:10px;border:none">
            @if (cargando) {
              <span class="spinner-border spinner-border-sm me-2"></span>Registrando...
            } @else {
              <i class="bi bi-person-check me-2"></i>Crear cuenta
            }
          </button>

        </form>

        <div class="text-center mt-3">
          <span class="text-muted small">¿Ya tienes cuenta? </span>
          <a routerLink="/login" class="fw-semibold text-decoration-none"
             style="color:#1D9E75">Inicia sesión</a>
        </div>

      </div>
    </div>

  </div>
</div>
