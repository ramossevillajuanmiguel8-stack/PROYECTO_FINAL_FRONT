<app-navbar />
<div class="container-fluid p-4" style="background:#f4f6fb;min-height:calc(100vh - 56px)">

  <div class="d-flex align-items-center gap-3 mb-4">
    <div class="icon-box" style="background:#0F6E56">
      <i class="bi bi-speedometer2 text-white fs-4"></i>
    </div>
    <div>
      <h4 class="fw-bold mb-0">Panel Operativo</h4>
      <p class="text-muted mb-0 small">Gestión del torneo Mundial 2026</p>
    </div>
  </div>

  <div class="row g-3 mb-4">
    <div class="col-6 col-md-3">
      <div class="metric-card">
        <div class="metric-icon" style="background:#E8F8F2">
          <i class="bi bi-calendar3 fs-4" style="color:#0F6E56"></i>
        </div>
        <div class="metric-num">{{ totalPartidos }}</div>
        <div class="metric-lbl">Total partidos</div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="metric-card">
        <div class="metric-icon" style="background:#FEF9E7">
          <i class="bi bi-clock fs-4" style="color:#F5C518"></i>
        </div>
        <div class="metric-num">{{ programados }}</div>
        <div class="metric-lbl">Programados</div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="metric-card">
        <div class="metric-icon" style="background:#EEF3FE">
          <i class="bi bi-flag fs-4" style="color:#534AB7"></i>
        </div>
        <div class="metric-num">{{ totalEquipos }}</div>
        <div class="metric-lbl">Equipos</div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="metric-card">
        <div class="metric-icon" style="background:#FDECEA">
          <i class="bi bi-collection fs-4" style="color:#993C1D"></i>
        </div>
        <div class="metric-num">{{ totalGrupos }}</div>
        <div class="metric-lbl">Grupos</div>
      </div>
    </div>
  </div>

  <h6 class="fw-bold text-muted mb-3 text-uppercase" style="font-size:11px;letter-spacing:1px">Accesos rápidos</h6>
  <div class="row g-3">
    @for (accion of acciones; track accion.ruta) {
      <div class="col-6 col-md-4 col-lg-2">
        <a [routerLink]="accion.ruta" class="accion-card text-decoration-none">
          <div class="accion-icon" [style.background]="accion.color + '22'">
            <i class="bi {{ accion.icon }} fs-3" [style.color]="accion.color"></i>
          </div>
          <div class="accion-label">{{ accion.label }}</div>
        </a>
      </div>
    }
  </div>
</div>
