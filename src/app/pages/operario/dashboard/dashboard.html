<app-navbar />
<div class="container-fluid p-4" style="background:#f4f6fb;min-height:calc(100vh - 56px)">

  <div class="d-flex align-items-center gap-3 mb-4">
    <div class="icon-box" style="background:#993C1D">
      <i class="bi bi-speedometer2 text-white fs-4"></i>
    </div>
    <div>
      <h4 class="fw-bold mb-0">Panel Operario</h4>
      <p class="text-muted mb-0 small">Registro de resultados y jugadores</p>
    </div>
  </div>

  <div class="row g-3 mb-4">
    <div class="col-6 col-md-4">
      <div class="metric-card">
        <div class="metric-icon" style="background:#FEF9E7">
          <i class="bi bi-clock fs-4" style="color:#F5C518"></i>
        </div>
        <div class="metric-num">{{ programados }}</div>
        <div class="metric-lbl">Partidos por jugar</div>
      </div>
    </div>
    <div class="col-6 col-md-4">
      <div class="metric-card">
        <div class="metric-icon" style="background:#E8F8F2">
          <i class="bi bi-trophy fs-4" style="color:#1D9E75"></i>
        </div>
        <div class="metric-num">{{ jugados }}</div>
        <div class="metric-lbl">Partidos jugados</div>
      </div>
    </div>
    <div class="col-6 col-md-4">
      <div class="metric-card">
        <div class="metric-icon" style="background:#FDECEA">
          <i class="bi bi-person-badge fs-4" style="color:#993C1D"></i>
        </div>
        <div class="metric-num">{{ totalJugadores }}</div>
        <div class="metric-lbl">Jugadores registrados</div>
      </div>
    </div>
  </div>

  <h6 class="fw-bold text-muted mb-3 text-uppercase" style="font-size:11px;letter-spacing:1px">Acciones</h6>
  <div class="row g-3">
    @for (accion of acciones; track accion.ruta) {
      <div class="col-6 col-md-3">
        <a [routerLink]="accion.ruta" class="accion-card text-decoration-none">
          <div class="accion-icon" [style.background]="accion.color + '22'">
            <i class="bi {{ accion.icon }} fs-2" [style.color]="accion.color"></i>
          </div>
          <div class="accion-label">{{ accion.label }}</div>
        </a>
      </div>
    }
  </div>
</div>
